<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- تدرج الخلفية الداكن الفاخر -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d232e" />
      <stop offset="50%" stop-color="#4a2f4c" />
      <stop offset="100%" stop-color="#1f1820" />
    </linearGradient>
    <!-- تدرج الأكسنت الذهبي/الوردي -->
    <linearGradient id="textAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4c2ce" />
      <stop offset="100%" stop-color="#b993b0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- إطار ديكوري داخلي رفيع -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#b993b0" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- الزخرفة الوسطية العلوية (Sparkle) -->
  <g transform="translate(600, 115) scale(1.3)">
    <path d="M 0 -20 C 0 -6 6 0 20 0 C 6 0 0 6 0 20 C 0 6 -6 0 -20 0 C -6 0 0 -6 0 -20 Z" fill="#f4c2ce" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- اسم البراند الرئيسي -->
  <text 
    x="600" 
    y="225" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="64" 
    font-weight="700" 
    letter-spacing="12" 
    fill="#fdfafd" 
    text-anchor="middle"
  >GLOWVY</text>

  <!-- الساب تايتل -->
  <text 
    x="600" 
    y="265" 
    font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
    font-size="16" 
    font-weight="600" 
    letter-spacing="6" 
    fill="#b993b0" 
    text-anchor="middle"
  >BEAUTY CENTER · LONDON</text>

  <!-- خط الفاصل الزخرفي للموقع -->
  <g transform="translate(540, 295)">
    <line x1="-80" y1="0" x2="200" y2="0" stroke="#f4c2ce" stroke-width="1.2" stroke-opacity="0.4" />
    <polygon points="60,-5 65,0 60,5 55,0" fill="#f4c2ce" />
  </g>

  <!-- العنوان الترويجي الرئيسي -->
  <text 
    x="600" 
    y="365" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="34" 
    font-weight="400" 
    fill="#fdfafd" 
    text-anchor="middle"
  >Your Happy Place For Self-Care &amp; Natural Glow</text>

  <!-- قائمة شارات الخدمات الأبرز -->
  <g transform="translate(600, 440)">
    <!-- البادج -->
    <rect x="-380" y="-20" width="760" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="#b993b0" stroke-width="1" stroke-opacity="0.3" />
    <text 
      x="0" 
      y="6" 
      font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
      font-size="15" 
      font-weight="500" 
      letter-spacing="2" 
      fill="#f4c2ce" 
      text-anchor="middle"
    >JAPANESE HEAD SPA  ·  FACIALS  ·  HAIR &amp; NAILS  ·  SPA RITUALS</text>
  </g>

  <!-- الفوتر السفلي للبانر -->
  <text 
    x="600" 
    y="535" 
    font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
    font-size="15" 
    font-weight="400" 
    letter-spacing="1" 
    fill="#b993b0" 
    text-anchor="middle"
  >Victoria Road, London  ·  Daily: 10:00 AM – 12:00 AM  ·  @glowvy.beauty</text>
</svg>
